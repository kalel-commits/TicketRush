server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    # single-node dev registry: don't hold on to dead instances while the stack restarts
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health
