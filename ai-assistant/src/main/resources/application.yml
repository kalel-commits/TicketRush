server:
  port: 8086

spring:
  application:
    name: ai-assistant
  threads:
    virtual:
      enabled: true
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:not-configured}   # calls fail (-> 503 ASSISTANT_UNAVAILABLE) until a real key is set
      timeout: 60s                       # spec §14: a hung call must not hold the user for minutes
      max-retries: 2                     # SDK retries on 429/5xx (spec §14)
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: 6334                       # gRPC
        collection-name: ticketrush_kb
        initialize-schema: true          # cosine, dimensions from the embedding model (384)
    embedding:
      transformer:
        cache:
          directory: ${ONNX_CACHE_DIR:${user.home}/.ticketrush/onnx-cache}   # U2: downloaded once into a volume

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-components: always

ticketrush:
  jwt:
    public-key: file:${JWT_PUBLIC_KEY_FILE:./infra/keys/public/jwt-public.pem}
  ai:
    model: claude-opus-5-5             # spec §24.6; a cheaper model is the owner's call (U4)
    max-tokens: 8192
    effort: low
    top-k: 4
    similarity-threshold: 0.35        # measured with all-MiniLM-L6-v2: on-topic top hits 0.50-0.77, off-topic <= 0.11 (spec 0.55 cut real answers)
    kb-version: kb-1                   # bump when knowledge/*.md changes -> re-ingest on startup
    ingest-on-startup: true
