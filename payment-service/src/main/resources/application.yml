server:
  port: 8085

spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/payment_db?connectionTimeZone=UTC
    username: payment_svc
    password: ${PAYMENT_DB_PASSWORD:payment-dev-password}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        allow.auto.create.topics: false
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics   # metrics: reconciler.*, kafka.dlt.messages, breaker state (port not published)

ticketrush:
  jwt:
    public-key: file:${JWT_PUBLIC_KEY_FILE:./infra/keys/public/jwt-public.pem}
  internal-jwt-secret: ${INTERNAL_JWT_SECRET:dev-internal-secret-change-me-0123456789}
  booking-service:
    base-url: http://booking-service    # resolved through Eureka by the @LoadBalanced client
  provider:
    base-url: ${PAYMENT_PROVIDER_URL:http://localhost:8090}   # external PSP: not in Eureka
  outbox:
    relay-interval-ms: 500
