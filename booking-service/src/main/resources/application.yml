server:
  port: 8083

spring:
  application:
    name: booking-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/booking_db?connectionTimeZone=UTC
    username: booking_svc
    password: ${BOOKING_DB_PASSWORD:booking-dev-password}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 200ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: booking-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        allow.auto.create.topics: false
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics   # metrics: reconciler.*, kafka.dlt.messages, breaker state (port not published)
  health:
    redis:
      enabled: false   # Redis is only a fast filter; an outage must not mark the service unhealthy

ticketrush:
  jwt:
    public-key: file:${JWT_PUBLIC_KEY_FILE:./infra/keys/public/jwt-public.pem}
  internal-jwt-secret: ${INTERNAL_JWT_SECRET:dev-internal-secret-change-me-0123456789}
  event-service:
    base-url: http://event-service      # resolved through Eureka by the @LoadBalanced client
  booking:
    max-seats-per-event: 4
    hold-seconds: 600
    holding-timeout-seconds: 60
    sweeper-interval-ms: 15000
  outbox:
    relay-interval-ms: 500
